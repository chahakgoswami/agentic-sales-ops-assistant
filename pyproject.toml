[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sales-ops-assistant"
version = "0.7.0"
description = "Agentic Sales Ops Assistant: enriches leads, drafts outreach, syncs CRM, and tracks forecasts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["sales", "crm", "ai", "agents", "outreach"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
sales-ops = "sales_ops.cli:main"
sales-ops-dashboard = "sales_ops.dashboard:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sales_ops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_cli = false

[tool.coverage.run]
source = ["sales_ops"]
omit = ["tests/*"]
